<script>
    // ==========================================
    // 1. FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyAG3qckC4mWEMwwOLGnaSjD8vugKDDe640",
        authDomain: "mh-sms-panel.firebaseapp.com",
        projectId: "mh-sms-panel",
        storageBucket: "mh-sms-panel.firebasestorage.app",
        messagingSenderId: "906195015461",
        appId: "1:906195015461:web:63a3fdbf7d228b13326ccc",
        measurementId: "G-JPGDB3GBZL"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ==========================================
    // 2. GLOBAL VARIABLES
    // ==========================================
    let currentUser = null;
    let userData = null;
    let verificationCode = '';
    let countdownInterval = null;
    let autoSyncInterval = null;
    let provisionedNumbers = [];
    let withdrawCooldown = false;

    // ==========================================
    // 3. AUTHENTICATION FUNCTIONS
    // ==========================================
    
    // Tab Switching
    function switchAuthTab(tab) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const tabs = document.querySelectorAll('.auth-tab');
        
        if (tab === 'login') {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
        } else {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
        }
    }

    // Google Login
    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
            .then((result) => handleAuthSuccess(result.user))
            .catch((error) => alert('Google Login Error: ' + error.message));
    }

    // Email/Password Login
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => handleAuthSuccess(userCredential.user))
            .catch((error) => alert('Login Error: ' + error.message));
    });

    // Registration
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const name = document.getElementById('regName').value;
        const mobile = document.getElementById('regMobile').value;
        const country = document.getElementById('regCountry').value;
        const pin = document.getElementById('regPin').value;
        const telegram = document.getElementById('regTelegram').value;
        
        // Generate 6-digit verification code
        verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
        
        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                return db.collection('users').doc(userCredential.user.uid).set({
                    uid: userCredential.user.uid,
                    email: email,
                    fullName: name,
                    mobile: mobile,
                    country: country,
                    withdrawPin: pin,
                    telegram: telegram,
                    balance: 0,
                    todayEarnings: 0,
                    yesterdayEarnings: 0,
                    todayOtp: 0,
                    totalOtps: 0,
                    approved: false,
                    isAdmin: false,
                    isOwner: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    loginMethod: 'email'
                });
            })
            .then(() => {
                showVerificationModal(email);
                startVerificationTimer();
            })
            .catch((error) => alert('Registration Error: ' + error.message));
    });

    // Show Verification Modal
    function showVerificationModal(email) {
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('verificationModal').classList.remove('hidden');
        document.getElementById('verificationEmail').textContent = email;
        document.getElementById('displayCode').textContent = verificationCode;
    }

    // Start Verification Timer
    function startVerificationTimer() {
        let timeLeft = 600; // 10 minutes
        countdownInterval = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `Expires in: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                document.getElementById('timer').textContent = 'Code expired!';
            }
            timeLeft--;
        }, 1000);
    }

    // Resend Code
    function resendCode() {
        const btn = document.getElementById('resendBtn');
        let cooldown = 60;
        btn.disabled = true;
        btn.textContent = `Resend Code (${cooldown}s)`;
        
        const interval = setInterval(() => {
            cooldown--;
            btn.textContent = `Resend Code (${cooldown}s)`;
            
            if (cooldown <= 0) {
                clearInterval(interval);
                btn.disabled = false;
                btn.textContent = 'Resend Code';
                verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
                document.getElementById('displayCode').textContent = verificationCode;
                startVerificationTimer();
            }
        }, 1000);
    }

    // Verify Code
    function verifyCode() {
        const inputCode = document.getElementById('verificationInput').value;
        
        if (inputCode === verificationCode) {
            clearInterval(countdownInterval);
            document.getElementById('verificationModal').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        } else {
            alert('Invalid code! Please try again.');
        }
    }

    // Go to Login
    function goToLogin() {
        document.getElementById('successMessage').classList.add('hidden');
        document.getElementById('authContainer').classList.remove('hidden');
        switchAuthTab('login');
    }

    // Handle Auth Success
    async function handleAuthSuccess(user) {
        currentUser = user;
        
        const userDoc = await db.collection('users').doc(user.uid).get();
        
        if (userDoc.exists) {
            userData = userDoc.data();
            
            if (!userData.approved) {
                alert('Your account is pending admin approval. Please wait.');
                auth.signOut();
                return;
            }
            
            showDashboard();
            loadUserData();
        } else {
            // First time Google login - create user doc
            await db.collection('users').doc(user.uid).set({
                uid: user.uid,
                email: user.email,
                fullName: user.displayName || 'User',
                mobile: '',
                country: '',
                withdrawPin: '',
                telegram: '',
                balance: 0,
                todayEarnings: 0,
                yesterdayEarnings: 0,
                todayOtp: 0,
                totalOtps: 0,
                approved: true,
                isAdmin: false,
                isOwner: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                loginMethod: 'google'
            });
            
            userData = { 
                approved: true, 
                balance: 0, 
                fullName: user.displayName || 'User',
                isAdmin: false,
                isOwner: false
            };
            
            showDashboard();
        }
    }

    // Show Dashboard
    function showDashboard() {
        document.getElementById('authContainer').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        const avatar = currentUser.email ? currentUser.email.charAt(0).toUpperCase() : 'U';
        document.getElementById('userAvatar').textContent = avatar;
        
        // Show admin menu if admin/owner
        if (userData && (userData.isAdmin || userData.isOwner)) {
            document.getElementById('adminMenu').style.display = 'block';
        }
        
        startAutoSync();
    }

    // Load User Data
    async function loadUserData() {
        if (!currentUser) return;
        
        const userDoc = await db.collection('users').doc(currentUser.uid).get();
        
        if (userDoc.exists) {
            userData = userDoc.data();
            
            document.getElementById('userName').textContent = userData.fullName || 'User';
            document.getElementById('userBalance').textContent = `৳ ${userData.balance || 0}`;
            document.getElementById('todayEarnings').textContent = `৳ ${userData.todayEarnings || 0}`;
            document.getElementById('todayOtp').textContent = userData.todayOtp || 0;
            document.getElementById('yesterdayEarnings').textContent = `৳ ${userData.yesterdayEarnings || 0}`;
            document.getElementById('totalOtps').textContent = userData.totalOtps || 0;
        }
    }

    // Logout
    function logout() {
        stopAutoSync();
        auth.signOut().then(() => {
            currentUser = null;
            userData = null;
            provisionedNumbers = [];
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('authContainer').style.display = 'block';
        });
    }

    // ==========================================
    // 4. NAVIGATION FUNCTIONS
    // ==========================================
    
    function showSection(section) {
        const sections = ['dashboard', 'getNumber', 'console', 'topUser', 'withdraw', 'profile', 'channel', 'api', 'admin'];
        
        sections.forEach(s => {
            const el = document.getElementById(s + 'Section');
            if (el) el.classList.add('hidden');
        });
        
        const target = document.getElementById(section + 'Section');
        if (target) target.classList.remove('hidden');
        
        // Load section-specific data
        if (section === 'topUser') loadTopUsers();
        if (section === 'console') fetchGlobalBroadcast();
        if (section === 'channel') loadChannelLink();
    }

    // ==========================================
    // 5. ZENEX API FUNCTIONS (VIA /api/zenex PROXY)
    // ==========================================
    
    // Get Number
    async function getNumber() {
        const range = document.getElementById('numberRange').value.trim();
        const isNational = document.getElementById('nationalFormat').checked;
        const removePlus = document.getElementById('removePlus').checked;
        
        if (!range) {
            alert('Please enter a number range (e.g., 22465XXX)');
            return;
        }

        const btn = event.target;
        btn.disabled = true;
        btn.innerHTML = '⏳ Processing...';

        try {
            const response = await fetch('/api/zenex?action=getnum', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    range: range,
                    is_national: isNational,
                    remove_plus: removePlus
                })
            });

            const data = await response.json();
            console.log('Get Number Response:', data);
            
            if (data.meta && data.meta.code === 200) {
                provisionedNumbers.push(data.data);
                updateNumberStats();
                addToFeed(data.data);
                alert(`✅ Number Provisioned Successfully!\n\n📱 Number: ${data.data.number}\n🌍 Country: ${data.data.country}\n📡 Operator: ${data.data.operator}\n📋 Status: ${data.data.status}`);
                document.getElementById('numberRange').value = '';
            } else {
                throw new Error(data.message || data.error || 'Failed to provision number');
            }
        } catch (error) {
            console.error('Get Number Error:', error);
            alert(`❌ Error: ${error.message}\n\nCheck browser console for details.`);
            const failedEl = document.getElementById('failedNumbers');
            failedEl.textContent = parseInt(failedEl.textContent || 0) + 1;
        } finally {
            btn.disabled = false;
            btn.innerHTML = '📱 GET NUMBER';
        }
    }

    // Update Number Stats
    function updateNumberStats() {
        const total = provisionedNumbers.length;
        const success = provisionedNumbers.filter(n => n.status === 'success').length;
        const wait = provisionedNumbers.filter(n => n.status === 'pending').length;
        const failed = total - success - wait;
        
        document.getElementById('totalNumbers').textContent = total;
        document.getElementById('successNumbers').textContent = success;
        document.getElementById('waitNumbers').textContent = wait;
        document.getElementById('failedNumbers').textContent = failed;
        
        const rate = total > 0 ? ((success / total) * 100).toFixed(1) : 0;
        document.getElementById('successRate').textContent = rate + '%';
    }

    // Add to Feed
    function addToFeed(numberData) {
        const feed = document.getElementById('numberFeed');
        const item = document.createElement('div');
        item.className = 'feed-item';
        item.innerHTML = `
            <div style="color: #10b981; font-weight: bold;">✅ ${numberData.number}</div>
            <div style="color: #94a3b8; font-size: 12px; margin-top: 5px;">
                ${numberData.country} | ${numberData.operator} | ${numberData.status}
            </div>
        `;
        feed.insertBefore(item, feed.firstChild);
    }

    // Fetch OTPs (Live Console)
    async function fetchZenexData() {
        const output = document.getElementById('consoleOutput');
        const statusBadge = document.getElementById('consoleStatus');
        
        try {
            const response = await fetch('/api/zenex?action=numsuccess', {
                method: 'GET'
            });

            const result = await response.json();
            console.log('Numsuccess Response:', result);
            
            if (result.meta && result.meta.code === 200) {
                const otps = result.data.otps || [];
                
                if (otps.length === 0) {
                    output.innerHTML = `<div style="color: #f59e0b;">⏳ Waiting for OTPs...</div>
<div style="color: #94a3b8; margin-top: 10px;">📡 Polling every 5 seconds.<br>🔍 No OTPs received yet.</div>`;
                } else {
                    let html = `<div style="color: #10b981; margin-bottom: 15px; font-weight: bold;">✅ ${otps.length} OTP(s) Received</div>`;
                    
                    otps.forEach(otp => {
                        html += `<div style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                            <div style="color: #3b82f6; font-weight: bold; margin-bottom: 5px;"> ${otp.number} (${otp.country})</div>
                            <div style="color: #e2e8f0; font-family: monospace; font-size: 18px; margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 6px; word-break: break-all;">${otp.otp}</div>
                            <div style="color: #94a3b8; font-size: 12px;">
                                <span>📡 ${otp.operator}</span> | 
                                <span>🕐 ${otp.created_at}</span> |
                                <span>ID: ${otp.nid}</span>
                            </div>
                        </div>`;
                    });
                    
                    output.innerHTML = html;
                }
                
                statusBadge.textContent = 'LIVE';
                statusBadge.className = 'success-badge';
            } else {
                throw new Error(result.message || result.error || 'API Error');
            }
        } catch (error) {
            console.error('Fetch Error:', error);
            output.innerHTML = `<div style="color: #ef4444;">❌ ${error.message}</div>`;
            statusBadge.textContent = 'ERROR';
            statusBadge.className = 'error-badge';
        }
    }

    // Fetch Global Broadcast
    async function fetchGlobalBroadcast() {
        const output = document.getElementById('globalFeed');
        
        try {
            const response = await fetch('/api/zenex?action=global-broadcast', {
                method: 'GET'
            });

            const result = await response.json();
            console.log('Global Broadcast:', result);
            
            if (result.success) {
                const data = result.data || [];
                
                if (data.length === 0) {
                    output.innerHTML = `<div style="color: #f59e0b;">No recent OTPs in global feed</div>`;
                } else {
                    let html = `<div style="color: #10b981; margin-bottom: 15px; font-weight: bold;"> ${result.count} Recent OTPs</div>`;
                    
                    data.forEach(item => {
                        html += `<div style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                            <div style="color: #3b82f6; font-weight: bold;">📱 ${item.number} (${item.country})</div>
                            <div style="color: #e2e8f0; font-size: 16px; margin: 10px 0; font-family: monospace;">${item.otp}</div>
                            <div style="color: #94a3b8; font-size: 12px;">📡 ${item.service} | ${item.operator}</div>
                        </div>`;
                    });
                    
                    output.innerHTML = html;
                }
            } else {
                throw new Error(result.message || 'Failed to fetch global feed');
            }
        } catch (error) {
            console.error('Global Feed Error:', error);
            output.innerHTML = `<div style="color: #ef4444;">❌ ${error.message}</div>`;
        }
    }

    // Load Top Users
    async function loadTopUsers() {
        const output = document.getElementById('topUsersList');
        
        try {
            const snapshot = await db.collection('users')
                .orderBy('totalOtps', 'desc')
                .limit(10)
                .get();
            
            if (snapshot.empty) {
                output.innerHTML = '<div style="color: #94a3b8;">No users found</div>';
                return;
            }
            
            let html = '<div style="color: #10b981; margin-bottom: 15px; font-weight: bold;">🏆 Top 10 Users</div>';
            let rank = 1;
            
            snapshot.forEach(doc => {
                const user = doc.data();
                html += `<div style="background: rgba(59, 130, 246, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                    <div style="color: #3b82f6; font-weight: bold;">#${rank} ${user.fullName || 'Unknown'}</div>
                    <div style="color: #94a3b8; font-size: 12px;">Total OTPs: ${user.totalOtps || 0} | Earnings: ৳${user.todayEarnings || 0}</div>
                </div>`;
                rank++;
            });
            
            output.innerHTML = html;
        } catch (error) {
            console.error('Load Top Users Error:', error);
            output.innerHTML = `<div style="color: #ef4444;">❌ ${error.message}</div>`;
        }
    }

    // Load Channel Link
    async function loadChannelLink() {
        const output = document.getElementById('channelLink');
        
        try {
            const settingsDoc = await db.collection('settings').doc('global').get();
            
            if (settingsDoc.exists) {
                const settings = settingsDoc.data();
                const channelUrl = settings.telegramChannel || 'https://t.me/mhsmspanel';
                output.innerHTML = `<a href="${channelUrl}" target="_blank" class="btn btn-primary" style="display: inline-block; text-decoration: none;">JOIN CHANNEL</a>`;
            } else {
                output.innerHTML = `<a href="https://t.me/mhsmspanel" target="_blank" class="btn btn-primary" style="display: inline-block; text-decoration: none;">JOIN CHANNEL</a>`;
            }
        } catch (error) {
            console.error('Load Channel Error:', error);
            output.innerHTML = `<a href="https://t.me/mhsmspanel" target="_blank" class="btn btn-primary" style="display: inline-block; text-decoration: none;">JOIN CHANNEL</a>`;
        }
    }

    // ==========================================
    // 6. WITHDRAW FUNCTIONS
    // ==========================================
    
    async function confirmWithdraw() {
        if (withdrawCooldown) {
            alert('Please wait 1 hour between withdrawals');
            return;
        }
        
        const accountNumber = document.getElementById('withdrawAccount').value.trim();
        const amount = parseFloat(document.getElementById('withdrawAmount').value);
        const pin = document.getElementById('withdrawPin').value;
        const method = document.getElementById('withdrawMethod').value;
        
        if (!accountNumber || !amount || !pin) {
            alert('Please fill all fields');
            return;
        }
        
        if (amount < 50) {
            alert('Minimum withdrawal amount is ৳50');
            return;
        }
        
        if (pin !== userData.withdrawPin) {
            alert('Invalid security PIN');
            return;
        }
        
        if (amount > userData.balance) {
            alert('Insufficient balance');
            return;
        }
        
        try {
            await db.collection('withdrawals').add({
                uid: currentUser.uid,
                email: currentUser.email,
                fullName: userData.fullName,
                accountNumber: accountNumber,
                amount: amount,
                method: method,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            // Update user balance
            await db.collection('users').doc(currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(-amount)
            });
            
            alert('✅ Withdrawal request submitted successfully!');
            
            // Set cooldown
            withdrawCooldown = true;
            setTimeout(() => {
                withdrawCooldown = false;
            }, 3600000); // 1 hour
            
        } catch (error) {
            console.error('Withdraw Error:', error);
            alert('❌ Error: ' + error.message);
        }
    }

    // ==========================================
    // 7. AUTO SYNC FUNCTIONS
    // ==========================================
    
    function refreshConsole() {
        fetchZenexData();
    }

    function startAutoSync() {
        if (document.getElementById('autoSync').checked) {
            fetchZenexData();
            autoSyncInterval = setInterval(fetchZenexData, 5000);
        }
    }

    function stopAutoSync() {
        if (autoSyncInterval) {
            clearInterval(autoSyncInterval);
            autoSyncInterval = null;
        }
    }

    function toggleAutoSync() {
        if (document.getElementById('autoSync').checked) {
            startAutoSync();
        } else {
            stopAutoSync();
        }
    }

    // ==========================================
    // 8. INITIALIZATION
    // ==========================================
    
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            loadUserData().then(() => showDashboard());
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        console.log('✅ MH SMS PANEL Loaded');
        console.log('✅ Firebase Initialized');
        console.log('✅ Using /api/zenex proxy');
        console.log('📡 API Endpoints:');
        console.log('   - /api/zenex?action=getnum');
        console.log('   - /api/zenex?action=numsuccess');
        console.log('   - /api/zenex?action=global-broadcast');
    });
        </script>
